<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200" role="img" aria-label="ELITEpro connectors, blue adapter chain and enclosure front-panel concept"><style>text{font-family:Arial,Helvetica,sans-serif}.wire{cursor:pointer;transition:opacity .15s}.muted{opacity:.09}.selected .core{stroke-width:9}.wire:focus{outline:none}.wire:focus .core{stroke-width:9}</style><rect x="0" y="0" width="1800" height="1200" rx="0" fill="#fff" stroke="#fff" /><text x="48" y="55" font-size="34" fill="#203346" font-weight="700" text-anchor="start">Connector details | Match labels, not cable color</text><text x="48" y="91" font-size="20" fill="#63768a" font-weight="400" text-anchor="start">Based on the supplied ELITEpro XC photographs and DENT connector documentation. Not to scale.</text><text x="48" y="148" font-size="25" fill="#203346" font-weight="700" text-anchor="start">A. Three existing blue pigtails → three full voltage leads</text><text x="48" y="180" font-size="18" fill="#63768a" font-weight="400" text-anchor="start">Bare ends stay fixed inside guarded terminals. Disconnect mains and verify absence of voltage before unplugging these leads.</text><rect x="48" y="217" width="280" height="55" rx="6" fill="#f3f6f9" stroke="#c6d0db" /><text x="67" y="252" font-size="20" fill="#203346" font-weight="600" text-anchor="start">Fv protected hot</text><polyline points="328,245 398,245" fill="none" stroke="#8f98a2" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" /><polyline points="398,245 740,245" fill="none" stroke="#1567c1" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" /><text x="535" y="229" font-size="19" fill="#1567c1" font-weight="700" text-anchor="middle">A1 · HOT</text><rect x="718" y="230" width="72" height="30" rx="5" fill="#1673c5" stroke="#0b4f90" /><polyline points="790,245 829,245" fill="none" stroke="#8995a0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/><rect x="829" y="230" width="65" height="30" rx="5" fill="#dce2e8" stroke="#8393a1" /><polyline points="894,245 1290,245" fill="none" stroke="#202d3a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" /><text x="1085" y="227" font-size="17" fill="#63768a" font-weight="400" text-anchor="middle">Existing L1 lead (verify actual color)</text><rect x="1290" y="225" width="250" height="40" rx="5" fill="#e7f1fb" stroke="#99b5cc" /><text x="1415" y="252" font-size="21" fill="#203346" font-weight="700" text-anchor="middle">ELITEpro L1</text><rect x="48" y="302" width="280" height="55" rx="6" fill="#f3f6f9" stroke="#c6d0db" /><text x="67" y="337" font-size="20" fill="#203346" font-weight="600" text-anchor="start">Neutral terminal JN</text><polyline points="328,330 398,330" fill="none" stroke="#8f98a2" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" /><polyline points="398,330 740,330" fill="none" stroke="#1567c1" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" /><text x="535" y="314" font-size="19" fill="#1567c1" font-weight="700" text-anchor="middle">A2 · NEUTRAL</text><rect x="718" y="315" width="72" height="30" rx="5" fill="#1673c5" stroke="#0b4f90" /><polyline points="790,330 829,330" fill="none" stroke="#8995a0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/><rect x="829" y="315" width="65" height="30" rx="5" fill="#dce2e8" stroke="#8393a1" /><polyline points="894,330 1290,330" fill="none" stroke="#b8343e" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" /><text x="1085" y="312" font-size="17" fill="#63768a" font-weight="400" text-anchor="middle">Existing L2 lead (verify actual color)</text><rect x="1290" y="310" width="250" height="40" rx="5" fill="#e7f1fb" stroke="#99b5cc" /><text x="1415" y="337" font-size="21" fill="#203346" font-weight="700" text-anchor="middle">ELITEpro L2</text><rect x="48" y="387" width="280" height="55" rx="6" fill="#f3f6f9" stroke="#c6d0db" /><text x="67" y="422" font-size="20" fill="#203346" font-weight="600" text-anchor="start">Neutral terminal JN</text><polyline points="328,415 398,415" fill="none" stroke="#8f98a2" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" /><polyline points="398,415 740,415" fill="none" stroke="#1567c1" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" /><text x="535" y="399" font-size="19" fill="#1567c1" font-weight="700" text-anchor="middle">A3 · NEUTRAL</text><rect x="718" y="400" width="72" height="30" rx="5" fill="#1673c5" stroke="#0b4f90" /><polyline points="790,415 829,415" fill="none" stroke="#8995a0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/><rect x="829" y="400" width="65" height="30" rx="5" fill="#dce2e8" stroke="#8393a1" /><polyline points="894,415 1290,415" fill="none" stroke="#65758a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" /><polyline points="894,415 1290,415" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="1085" y="397" font-size="17" fill="#63768a" font-weight="400" text-anchor="middle">Existing N lead (verify actual color)</text><rect x="1290" y="395" width="250" height="40" rx="5" fill="#e7f1fb" stroke="#99b5cc" /><text x="1415" y="422" font-size="21" fill="#203346" font-weight="700" text-anchor="middle">ELITEpro N</text><text x="340" y="474" font-size="17" fill="#63768a" font-weight="400" text-anchor="start">Tinned end → rated terminal</text><text x="716" y="474" font-size="17" fill="#63768a" font-weight="400" text-anchor="start">Shrouded mating pair</text><text x="1110" y="474" font-size="17" fill="#63768a" font-weight="400" text-anchor="start">Full voltage lead → meter socket</text><text x="48" y="522" font-size="21" fill="#1567c1" font-weight="700" text-anchor="start">All three short adapters are blue. Label BOTH ends A1/HOT, A2/NEUTRAL and A3/NEUTRAL.</text><text x="48" y="553" font-size="18" fill="#63768a" font-weight="400" text-anchor="start">These are sensing accessories. Use rated power conductors for the printer and separate correctly identified PE bonding.</text><text x="48" y="620" font-size="25" fill="#203346" font-weight="700" text-anchor="start">B. Meter end views</text><rect x="48" y="642" width="730" height="240" rx="12" fill="#253642" stroke="#253642" /><rect x="105" y="665" width="31" height="31" rx="4" fill="#dce3e8" stroke="#dce3e8" /><text x="120" y="687" font-size="20" fill="#203346" font-weight="700" text-anchor="middle">+</text><rect x="152" y="665" width="31" height="31" rx="4" fill="#dce3e8" stroke="#dce3e8" /><text x="167" y="687" font-size="20" fill="#203346" font-weight="700" text-anchor="middle">−</text><text x="144" y="725" font-size="19" fill="#fff" font-weight="600" text-anchor="middle">CH1</text><rect x="235" y="665" width="31" height="31" rx="4" fill="#dce3e8" stroke="#dce3e8" /><text x="250" y="687" font-size="20" fill="#203346" font-weight="700" text-anchor="middle">+</text><rect x="282" y="665" width="31" height="31" rx="4" fill="#dce3e8" stroke="#dce3e8" /><text x="297" y="687" font-size="20" fill="#203346" font-weight="700" text-anchor="middle">−</text><text x="274" y="725" font-size="19" fill="#fff" font-weight="600" text-anchor="middle">CH2</text><rect x="365" y="665" width="31" height="31" rx="4" fill="#dce3e8" stroke="#dce3e8" /><text x="380" y="687" font-size="20" fill="#203346" font-weight="700" text-anchor="middle">+</text><rect x="412" y="665" width="31" height="31" rx="4" fill="#dce3e8" stroke="#dce3e8" /><text x="427" y="687" font-size="20" fill="#203346" font-weight="700" text-anchor="middle">−</text><text x="404" y="725" font-size="19" fill="#fff" font-weight="600" text-anchor="middle">CH3</text><rect x="495" y="665" width="31" height="31" rx="4" fill="#dce3e8" stroke="#dce3e8" /><text x="510" y="687" font-size="20" fill="#203346" font-weight="700" text-anchor="middle">+</text><rect x="542" y="665" width="31" height="31" rx="4" fill="#dce3e8" stroke="#dce3e8" /><text x="557" y="687" font-size="20" fill="#203346" font-weight="700" text-anchor="middle">−</text><text x="534" y="725" font-size="19" fill="#fff" font-weight="600" text-anchor="middle">CH4</text><rect x="666" y="665" width="35" height="31" rx="4" fill="#dce3e8" stroke="#dce3e8" /><text x="683" y="725" font-size="20" fill="#fff" font-weight="600" text-anchor="middle">S</text><circle cx="147" cy="779" r="24" fill="#fff" stroke="#94a6b5" stroke-width="2" /><circle cx="147" cy="779" r="12" fill="#162533" stroke="#8497a8" stroke-width="2" /><text x="147" y="830" font-size="25" fill="#fff" font-weight="700" text-anchor="middle">N</text><text x="147" y="861" font-size="14" fill="#e3edf7" font-weight="500" text-anchor="middle">NEUTRAL</text><circle cx="317" cy="779" r="24" fill="#121d27" stroke="#94a6b5" stroke-width="2" /><circle cx="317" cy="779" r="12" fill="#162533" stroke="#8497a8" stroke-width="2" /><text x="317" y="830" font-size="25" fill="#fff" font-weight="700" text-anchor="middle">L3</text><text x="317" y="861" font-size="14" fill="#e3edf7" font-weight="500" text-anchor="middle">UNUSED</text><circle cx="487" cy="779" r="24" fill="#121d27" stroke="#94a6b5" stroke-width="2" /><circle cx="487" cy="779" r="12" fill="#162533" stroke="#8497a8" stroke-width="2" /><text x="487" y="830" font-size="25" fill="#fff" font-weight="700" text-anchor="middle">L2</text><text x="487" y="861" font-size="14" fill="#e3edf7" font-weight="500" text-anchor="middle">NEUTRAL</text><circle cx="657" cy="779" r="24" fill="#121d27" stroke="#94a6b5" stroke-width="2" /><circle cx="657" cy="779" r="12" fill="#162533" stroke="#8497a8" stroke-width="2" /><text x="657" y="830" font-size="25" fill="#fff" font-weight="700" text-anchor="middle">L1</text><text x="657" y="861" font-size="14" fill="#e3edf7" font-weight="500" text-anchor="middle">HOT</text><text x="48" y="911" font-size="17" fill="#63768a" font-weight="400" text-anchor="start">CT input ≠ mains. S is a shield terminal, not an enclosure earth terminal.</text><rect x="824" y="642" width="480" height="240" rx="12" fill="#edf3f8" stroke="#afbecb" /><text x="848" y="678" font-size="20" fill="#203346" font-weight="400" text-anchor="start">Other end: power / USB / analog</text><text x="848" y="721" font-size="19" fill="#203346" font-weight="400" text-anchor="start">POWER IN: 6–10 V DC, 500 mA</text><text x="848" y="755" font-size="17" fill="#203346" font-weight="400" text-anchor="start">Verified DENT adapter; center positive.</text><text x="848" y="792" font-size="19" fill="#203346" font-weight="400" text-anchor="start">USB Type B → ELOG computer</text><text x="848" y="829" font-size="19" fill="#203346" font-weight="400" text-anchor="start">Analog CH1–CH4 ≠ CT CH1–CH4</text><text x="848" y="862" font-size="17" fill="#203346" font-weight="400" text-anchor="start">No mains into DC, USB, analog or CT ports.</text><rect x="1350" y="642" width="400" height="240" rx="12" fill="#f3f6f8" stroke="#aebdca" /><text x="1374" y="678" font-size="19" fill="#203346" font-weight="700" text-anchor="start">Box face · conceptual layout</text><rect x="1380" y="710" width="80" height="95" rx="6" fill="#fff" stroke="#8c9ba8" /><rect x="1400" y="735" width="40" height="45" rx="3" fill="#273440" stroke="#273440" /><text x="1420" y="832" font-size="18" fill="#203346" font-weight="700" text-anchor="middle">Q0</text><rect x="1510" y="710" width="200" height="135" rx="7" fill="#fff" stroke="#8c9ba8" /><rect x="1570" y="737" width="9" height="30" rx="1" fill="#273440" stroke="#273440" /><rect x="1630" y="737" width="9" height="30" rx="1" fill="#273440" stroke="#273440" /><circle cx="1605" cy="796" r="9" fill="#273440" stroke="#273440" stroke-width="2" /><text x="1610" y="835" font-size="15" fill="#203346" font-weight="700" text-anchor="middle">XA · ADAPTER ONLY</text><text x="1350" y="911" font-size="16" fill="#63768a" font-weight="400" text-anchor="start">Guard rear terminals; bond metal mounting parts.</text><rect x="48" y="961" width="1702" height="174" rx="10" fill="#f5f8fb" stroke="#c8d5df" /><text x="70" y="998" font-size="25" fill="#203346" font-weight="700" text-anchor="start">After assembly release and ELOG setup</text><circle cx="95" cy="1054" r="23" fill="#173f64" stroke="#173f64" stroke-width="2" /><text x="95" y="1062" font-size="22" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="135" y="1048" font-size="23" fill="#203346" font-weight="700" text-anchor="start">PLUG IN</text><text x="135" y="1082" font-size="17" fill="#63768a" font-weight="400" text-anchor="start">Printer + adapter + supply; Q0 OFF</text><circle cx="640" cy="1054" r="23" fill="#173f64" stroke="#173f64" stroke-width="2" /><text x="640" y="1062" font-size="22" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="680" y="1048" font-size="23" fill="#203346" font-weight="700" text-anchor="start">Q0 ON</text><text x="680" y="1082" font-size="17" fill="#63768a" font-weight="400" text-anchor="start">Printer, outlet and voltage tap powered</text><circle cx="1190" cy="1054" r="23" fill="#173f64" stroke="#173f64" stroke-width="2" /><text x="1190" y="1062" font-size="22" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="1230" y="1048" font-size="23" fill="#203346" font-weight="700" text-anchor="start">CHECK LOGGING</text><text x="1230" y="1082" font-size="17" fill="#63768a" font-weight="400" text-anchor="start">Confirm valid readings and recording</text><text x="48" y="1180" font-size="18" fill="#8b651e" font-weight="400" text-anchor="start">Voltage leads remain inside the closed enclosure during routine use. Q0 OFF does not isolate its incoming terminals.</text></svg>